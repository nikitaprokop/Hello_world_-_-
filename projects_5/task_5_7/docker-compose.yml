services:
  db:
    image: postgres:15
    container_name: postgres_student
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_task
    volumes:
      - pgdata_student:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_student:
docker compose up -d